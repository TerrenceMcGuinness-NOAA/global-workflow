  artifacts:
    when: always
    paths:
      - ${GW_HOMEgfs}/dev/ctests/build/result.xml
      - ${GW_HOMEgfs}/dev/ctests/build/Testing/Temporary/LastTest.log
    reports:
      junit: ${GW_HOMEgfs}/dev/ctests/build/result.xml
  needs:
    - create_ctests-${machine}
