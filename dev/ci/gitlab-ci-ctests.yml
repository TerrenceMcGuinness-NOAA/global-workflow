# ==========================================================================
# Templates and Configuration for CTest-Based Testing
# ==========================================================================
#
# This file defines jobs and templates for running CMake/CTest-based fuctional
# tests in the global-workflow project.  The CTests are designed to
# test specific Rocoto Jobs singluarly with predefined input data.
#
# CTests are primarily triggered via GitHub API for quick validation of PRs,
# whereas the full experiment cases are used for more extensive testing.
#
# Key components:
# - .create_ctests: Template for setting up the CMake/CTest environment
# - .run_ctests_template: Template for executing specific CTest labels
#
# CTests are defined in the dev/ctests directory and are categorized by labels,
# which are referenced in the hosts file to determine which tests to run on
# which platforms.

# =======================================
# Templates for CTests
# =======================================

# Setup job for ctests using CMake
.create_ctests:
  extends: .base_config
  stage: create_experiments
  script: |
    echo "=== Checking shell configuration ==="
    
    # Check for trap commands in the current shell
    echo "Current trap settings:"
    trap -p
    
    # Check for trap commands in shell startup files
    echo "=== Content of shell startup files ==="
    for file in ~/.bashrc ~/.bash_profile ~/.profile /etc/bashrc /etc/profile /etc/bash.bashrc; do
      if [ -f "$file" ]; then
        echo "--- Contents of $file ---"
        grep -i "trap\|EXIT\|return\|exit" "$file" || echo "No exit handling in $file"
      fi
    done
    
    # Test basic exit code propagation
    echo "=== Testing exit code propagation ==="
    (exit 1) && echo "Exit code was lost" || echo "Exit code was preserved"
    
    # Check if set -e is active or any other shell options
    echo "=== Current shell options ==="
    echo "Current set options: $-"
    shopt
    
    # List environment variables that might affect behavior
    echo "=== Environment variables that might affect shell behavior ==="
    env | grep -i "bash\|shell\|exit"
    
    # Force failure to see if it propagates to GitLab
    echo "=== Now forcing a failure to check GitLab reporting ==="
    (echo "This command will exit with status 1"; exit 1)
  needs:
    - build-${machine}

# Main template for CTest execution jobs
.run_ctests_template:
  extends: .base_config
  stage: run_tests
  script: |
    echo "=== Checking shell configuration ==="
    
    # Check for trap commands in the current shell
    echo "Current trap settings:"
    trap -p
    
    # Check for trap commands in shell startup files
    echo "=== Content of shell startup files ==="
    for file in ~/.bashrc ~/.bash_profile ~/.profile /etc/bashrc /etc/profile /etc/bash.bashrc; do
      if [ -f "$file" ]; then
        echo "--- Contents of $file ---"
        grep -i "trap\|EXIT\|return\|exit" "$file" || echo "No exit handling in $file"
      fi
    done
    
    # Test basic exit code propagation
    echo "=== Testing exit code propagation ==="
    (exit 1) && echo "Exit code was lost" || echo "Exit code was preserved"
    
    # Check if set -e is active or any other shell options
    echo "=== Current shell options ==="
    echo "Current set options: $-"
    shopt
    
    # List environment variables that might affect behavior
    echo "=== Environment variables that might affect shell behavior ==="
    env | grep -i "bash\|shell\|exit"
    
    # Force failure to see if it propagates to GitLab
    echo "=== Now forcing a failure to check GitLab reporting ==="
    (echo "This command will exit with status 1"; exit 1)
  artifacts:
    when: always
    paths:
      - ${GW_HOMEgfs}/dev/ctests/build/result.xml
      - ${GW_HOMEgfs}/dev/ctests/build/Testing/Temporary/LastTest.log
    reports:
      junit: ${GW_HOMEgfs}/dev/ctests/build/result.xml
  needs:
    - create_ctests-${machine}
