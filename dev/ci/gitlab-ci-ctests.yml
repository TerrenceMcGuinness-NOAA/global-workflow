      # 1. Try using bash 'false' builtin which should set $? to 1
      false
      
      # 2. If we're still running, try to make GitLab see non-zero status with command substitution
      $(exit 1)
      
      # 3. Last resort - use a command that will definitely fail
      cd /directory_that_does_not_exist_anywhere
    else
      echo "==========================================================="
      echo "SUCCESS: All CTests passed!"
      echo "==========================================================="
