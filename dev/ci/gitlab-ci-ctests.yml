# ==========================================================================
# Templates and Configuration for CTest-Based Testing
# ==========================================================================
#
# This file defines jobs and templates for running CMake/CTest-based fuctional
# tests in the global-workflow project.  The CTests are designed to
# test specific Rocoto Jobs singluarly with predefined input data.
#
# CTests are primarily triggered via GitHub API for quick validation of PRs,
# whereas the full experiment cases are used for more extensive testing.
#
# Key components:
# - .create_ctests: Template for setting up the CMake/CTest environment
# - .run_ctests_template: Template for executing specific CTest labels
#
# CTests are defined in the dev/ctests directory and are categorized by labels,
# which are referenced in the hosts file to determine which tests to run on
# which platforms.

# =======================================
# Templates for CTests
# =======================================

# Setup job for ctests using CMake
.create_ctests:
  extends: .base_config
  stage: create_experiments
  script: |
    # Trick to force GitLab to respect exit codes on all systems
    TEST_RESULT_FILE="/tmp/test_result_${CI_JOB_ID}"
    echo "0" > $TEST_RESULT_FILE
    
    echo "Using build directory ${GW_HOMEgfs}"
    source ${GW_HOMEgfs}/dev/ush/gw_setup.sh
    module load cmake
    cd ${GW_HOMEgfs}/dev/ctests/build
    echo "Running CTests with label: ${CTEST} in ${PWD}"
    
    # Check if tests exist
    num=$(ctest -N -L ${CTEST} | grep "Total Tests" | awk '{print $3}' || echo "0")
    if [ "$num" -eq 0 ]; then
      echo "No tests found with label: ${CTEST}"
      echo "1" > $TEST_RESULT_FILE
    else
      # Run the tests
      ctest -L ${CTEST} --output-junit result.xml --output-on-failure
      CTEST_EXIT=$?
      
      if [ $CTEST_EXIT -ne 0 ]; then
        echo "CTest command failed with exit code: $CTEST_EXIT"
        echo "1" > $TEST_RESULT_FILE
      fi
      
      # Double-check result XML for failures
      if [ -f result.xml ]; then
        failures=$(grep -c "failures=\"[1-9][0-9]*\"" result.xml || echo "0")
        errors=$(grep -c "errors=\"[1-9][0-9]*\"" result.xml || echo "0")
        
        if [ "$failures" -gt 0 ] || [ "$errors" -gt 0 ]; then
          echo "Test failures detected in JUnit report: Failures=$failures, Errors=$errors"
          echo "1" > $TEST_RESULT_FILE
        fi
      fi
    fi
    
    # Final check of test result regardless of previous error handling
    if [ "$(cat $TEST_RESULT_FILE)" != "0" ]; then
      echo "==========================================================="
      echo "ERROR: Tests failed! See log for details."
      echo "==========================================================="
      rm -f $TEST_RESULT_FILE
      
      # These approaches will be tried in sequence to ensure GitLab sees the failure
      
      # 1. Try using bash 'false' builtin which should set $? to 1
      false
      
      # 2. If we're still running, try to make GitLab see non-zero status with command substitution
      $(exit 1)
      
      # 3. Last resort - use a command that will definitely fail
      cd /directory_that_does_not_exist_anywhere
    else
      echo "==========================================================="
      echo "SUCCESS: All CTests passed!"
      echo "==========================================================="
      rm -f $TEST_RESULT_FILE
    fi
  needs:
    - build-${machine}

.run_ctests_template:
  extends: .base_config
  stage: run_tests
  script: |
    # Trick to force GitLab to respect exit codes on all systems
    TEST_RESULT_FILE="/tmp/test_result_${CI_JOB_ID}"
    echo "0" > $TEST_RESULT_FILE
    
    echo "Using build directory ${GW_HOMEgfs}"
    source ${GW_HOMEgfs}/dev/ush/gw_setup.sh
    module load cmake
