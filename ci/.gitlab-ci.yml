# Meta Pipeline - Global Workflow CI/CD
# This file orchestrates multiple pipelines for different CI/CD functions

# Common global variables
variables:
  GIT_DEPTH: 1

# Include all pipeline files
include:
  - local: '/ci/pipelines/build-and-run-tests.yml'
  - local: '/ci/pipelines/ctests-pipeline.yml'

# Main workflow control
workflow:
  rules:
    # Standard pipeline trigger (via nightly schedule only)
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        # Run the standard build and test pipeline on schedule
        RUN_TYPE: nightly_pipeline
    
    # Webhook trigger for ctests
    - if: '$CI_PIPELINE_SOURCE == "webhook" && $WEBHOOK_TRIGGER == "ctests"'
      variables:
        RUN_TYPE: ctests_pipeline

# These jobs control which parts of the pipeline are actually run
nightly_pipeline_trigger:
  stage: .pre
  script:
    - echo "Triggering standard build and run tests pipeline (nightly scheduled run)"
  rules:
    - if: '$RUN_TYPE == "nightly_pipeline"'
      when: always
    - when: never

ctests_pipeline_trigger:
  stage: .pre
  script:
    - echo "Triggering ctests pipeline only"
  rules:
    - if: '$RUN_TYPE == "ctests_pipeline" || $WEBHOOK_TRIGGER == "ctests"'
      when: always
    - when: never
